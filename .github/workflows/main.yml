name: MK Helper Bot (Trailer & Box Office)

on:
  workflow_dispatch:
  schedule:
    # ಪ್ರತಿದಿನ ಬೆಳಗ್ಗೆ 7:30 AM IST (02:00 UTC) ಮತ್ತು ಮಧ್ಯಾಹ್ನ 12:30 PM IST (07:00 UTC) ಕ್ಕೆ ರನ್ ಆಗುತ್ತದೆ
    - cron: '0 2 * * *'
    - cron: '0 7 * * *'

permissions:
  contents: write

jobs:
  run-helper-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg, Deno and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip curl
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create YouTube Cookies File (Optional)
        if: env.YT_COOKIES != ''
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          echo "$YT_COOKIES" > cookies.txt

      - name: Run Helper Bot Script
        env:
          HELPER_BOT_TOKEN: ${{ secrets.HELPER_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python helper_bot.py

      - name: Save History to Repo
        run: |
          rm -rf temp_media cookies.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add helper_history.json
          git commit -m "Update helper bot video history" || echo "No changes to commit"
          git push
