name: MK Helper Bot (Trailer, Script & Algenib Voice)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 7 * * *'

permissions:
  contents: write

jobs:
  run-helper-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Helper Bot Script
        env:
          HELPER_BOT_TOKEN: ${{ secrets.HELPER_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python helper_bot.py

      - name: Save History to Repo
        run: |
          rm -f *.wav *.mp3 concat_list.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add helper_history.json
          git commit -m "Update helper bot video history" || echo "No changes to commit"
          git push
